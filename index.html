<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spotify by min</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #121212;
            --bg-sidebar: #000000;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border-color: #282828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            font-size: 20px;
            font-weight: bold;
            padding-left: 8px;
        }

        .logo i {
            color: var(--primary);
            font-size: 28px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: bold;
            padding: 0 8px;
            letter-spacing: 1px;
        }

        .btn-add-playlist {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-add-playlist:hover { color: var(--text-main); }

        .playlist-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .playlist-item:hover, .playlist-item.active {
            background-color: var(--bg-card-hover);
            color: var(--text-main);
        }

        .playlist-item.active {
            border-left: 4px solid var(--primary);
            border-radius: 0 6px 6px 0;
        }

        .playlist-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }
        
        .playlist-info span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: linear-gradient(to bottom, #222222, var(--bg-black));
            padding: 24px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background-color: var(--bg-card-hover);
        }

        .upload-area i {
            font-size: 36px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .upload-area p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .upload-area span {
            color: var(--text-main);
            font-weight: bold;
        }

        /* Song List */
        .songs-section h3 {
            font-size: 22px;
            margin-bottom: 16px;
        }

        .song-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .song-row:hover { background-color: var(--bg-card-hover); }

        .song-row.active-song {
            background-color: rgba(29, 185, 84, 0.15);
        }

        .song-row.active-song .song-title { color: var(--primary); }

        .song-index {
            width: 30px;
            color: var(--text-sub);
            font-size: 14px;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .song-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            flex-shrink: 0;
        }

        .song-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .song-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 13px;
            color: var(--text-sub);
        }

        .song-actions {
            width: 40px;
            text-align: right;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-delete:hover { color: #ff4d4d; }

        /* Player Bar */
        .player-bar {
            height: 95px;
            background-color: #181818;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .np-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 24px;
        }

        .now-playing-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .np-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-artist {
            font-size: 12px;
            color: var(--text-sub);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .control-btns {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-ctrl:hover { color: var(--text-main); }
        .btn-ctrl.active-mode { color: var(--primary); }

        .btn-play-pause {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--text-main);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .btn-play-pause:hover { transform: scale(1.06); }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-text {
            font-size: 12px;
            color: var(--text-sub);
            width: 40px;
            text-align: center;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #4d4d4d;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }

        .progress-container:hover .progress-bar::-webkit-slider-thumb { opacity: 1; }

        .empty-spacer { width: 30%; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; max-height: 200px; }
            .main-content { padding: 16px; }
            .song-index { display: none; }
            .player-bar { flex-direction: column; height: auto; padding: 12px 16px; gap: 12px; }
            .now-playing { width: 100%; }
            .player-controls { width: 100%; }
            .empty-spacer { display: none; }
        }
    </style>
</head>
<body>

    <audio id="audio-player"></audio>
    <!-- Ô chọn file ẩn -->
    <input type="file" id="file-input" accept="audio/*" multiple style="display: none;">

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-spotify"></i>
                <span>spotify by min</span>
            </div>
            <hr style="border-color: var(--border-color); margin-top: -5px;">
            <div class="playlist-header">
                <span>DANH SÁCH PHÁT</span>
                <button class="btn-add-playlist" title="Tạo danh sách phát mới" onclick="createNewPlaylist()">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <ul class="playlist-list" id="playlist-container"></ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Ô Tải/Kéo Nhạc Về Storage -->
            <div class="upload-area" id="upload-box" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Nhấp vào đây hoặc kéo thả bài hát (MP3, WAV, M4A) vào đây</p>
                <span>Nhạc sẽ được lưu trữ vĩnh viễn trên trang web của bạn</span>
            </div>

            <div class="songs-section">
                <h3 id="current-playlist-title">Danh sách bài hát</h3>
                <div class="song-list-container" id="song-list-body"></div>
                <div id="empty-msg" class="empty-state">
                    Danh sách chưa có bài hát. Hãy tải nhạc lên để phát!
                </div>
            </div>
        </div>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <div class="np-icon-box">
                <i class="fa-solid fa-music"></i>
            </div>
            <div class="now-playing-info">
                <div id="np-title" class="np-title">Chưa chọn bài hát</div>
                <div id="np-artist" class="np-artist">spotify by min</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button class="btn-ctrl" id="btn-shuffle" title="Phát ngẫu nhiên" onclick="toggleShuffle()">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button class="btn-ctrl" title="Bài trước" onclick="playPrev()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="btn-play-pause" id="btn-play" onclick="togglePlay()">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="btn-ctrl" title="Bài tiếp theo" onclick="playNext()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="btn-ctrl" id="btn-repeat" title="Lặp lại" onclick="toggleRepeat()">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>

            <div class="progress-container">
                <span class="time-text" id="curr-time">00:00</span>
                <input type="range" id="seek-bar" class="progress-bar" value="0" min="0" max="100" oninput="seekToPosition(this.value)">
                <span class="time-text" id="total-time">00:00</span>
            </div>
        </div>

        <div class="empty-spacer"></div>
    </div>

    <script>
        // --- CẤU HÌNH CƠ SỞ DỮ LIỆU INDEXEDDB (LƯU TRỮ VĨNH VIỄN TRÊN BỘ NHỚ TRÌNH DUYỆT) ---
        let db;
        const dbName = "SpotifyMinDB";
        const request = indexedDB.open(dbName, 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("songs")) {
                db.createObjectStore("songs", { keyPath: "id" });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            loadSongsFromDB();
        };

        let playlists = [{ id: 1, name: "Nhạc của tôi", songs: [] }];
        let currentPlaylistId = 1;
        let currentSongIndex = -1;
        let isRepeat = false;
        let isShuffle = false;

        const audio = document.getElementById('audio-player');
        const seekBar = document.getElementById('seek-bar');
        const fileInput = document.getElementById('file-input');

        // Xử lý upload file
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Drag & Drop
        const uploadBox = document.getElementById('upload-box');
        uploadBox.addEventListener('dragover', (e) => { e.preventDefault(); });
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('audio/')) {
                    const songId = Date.now() + "_" + Math.random().toString(36).substr(2, 9);
                    const songData = {
                        id: songId,
                        title: file.name.replace(/\.[^/.]+$/, ""),
                        fileData: file,
                        playlistId: currentPlaylistId
                    };

                    // Lưu vào IndexedDB
                    const tx = db.transaction("songs", "readwrite");
                    tx.objectStore("songs").add(songData);

                    tx.oncomplete = () => {
                        loadSongsFromDB();
                    };
                }
            });
        }

        // Tải nhạc từ DB ra giao diện
        function loadSongsFromDB() {
            if (!db) return;
            const tx = db.transaction("songs", "readonly");
            const store = tx.objectStore("songs");
            const req = store.getAll();

            req.onsuccess = () => {
                const allSongs = req.result;
                playlists.forEach(pl => pl.songs = []);
                
                allSongs.forEach(s => {
                    const pl = playlists.find(p => p.id === s.playlistId) || playlists[0];
                    pl.songs.push(s);
                });

                renderPlaylists();
                renderSongs();
            };
        }

        function playSong(index) {
            const currentPl = playlists.find(p => p.id === currentPlaylistId);
            if (!currentPl || index < 0 || index >= currentPl.songs.length) return;

            currentSongIndex = index;
            const song = currentPl.songs[currentSongIndex];

            document.getElementById('np-title').innerText = song.title;

            // Tạo URL tạm thời từ Blob để phát nhạc
            if (audio.src) URL.revokeObjectURL(audio.src);
            audio.src = URL.createObjectURL(song.fileData);
            audio.play();
            updatePlayButton();
            renderSongs();
            setupMediaSession(song);
        }

        function togglePlay() {
            if (currentSongIndex === -1) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updatePlayButton();
        }

        function updatePlayButton() {
            const btn = document.getElementById('btn-play');
            btn.innerHTML = !audio.paused ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('btn-repeat').classList.toggle('active-mode', isRepeat);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('btn-shuffle').classList.toggle('active-mode', isShuffle);
        }

        function playNext() {
            const currentPl = playlists.find(p => p.id === currentPlaylistId);
            if (!currentPl || currentPl.songs.length === 0) return;

            if (isShuffle) {
                let randIndex = Math.floor(Math.random() * currentPl.songs.length);
                playSong(randIndex);
            } else {
                let nextIdx = (currentSongIndex + 1) % currentPl.songs.length;
                playSong(nextIdx);
            }
        }

        function playPrev() {
            const currentPl = playlists.find(p => p.id === currentPlaylistId);
            if (!currentPl || currentPl.songs.length === 0) return;

            let prevIdx = (currentSongIndex - 1 + currentPl.songs.length) % currentPl.songs.length;
            playSong(prevIdx);
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekBar.value = progress;
                document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
                document.getElementById('total-time').innerText = formatTime(audio.duration);
            }
        };

        audio.onended = () => {
            if (isRepeat) {
                playSong(currentSongIndex);
            } else {
                playNext();
            }
        };

        function seekToPosition(value) {
            if (audio.duration) {
                audio.currentTime = (value / 100) * audio.duration;
            }
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Xóa nhạc có thông báo xác nhận + xóa khỏi IndexedDB
        function deleteSong(index) {
            if (!confirm("Bạn có chắc chắn muốn xóa bài hát này khỏi máy không?")) return;

            const currentPl = playlists.find(p => p.id === currentPlaylistId);
            const songToDelete = currentPl.songs[index];

            // Xóa khỏi DB
            const tx = db.transaction("songs", "readwrite");
            tx.objectStore("songs").delete(songToDelete.id);

            tx.oncomplete = () => {
                if (index === currentSongIndex) {
                    audio.pause();
                    audio.src = '';
                    currentSongIndex = -1;
                    updatePlayButton();
                    document.getElementById('np-title').innerText = 'Chưa chọn bài hát';
                }
                loadSongsFromDB();
            };
        }

        function createNewPlaylist() {
            const name = prompt("Nhập tên danh sách phát mới:");
            if (name && name.trim()) {
                const newPl = { id: Date.now(), name: name.trim(), songs: [] };
                playlists.push(newPl);
                selectPlaylist(newPl.id);
            }
        }

        function selectPlaylist(id) {
            currentPlaylistId = id;
            renderPlaylists();
            renderSongs();
        }

        function renderPlaylists() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = '';
            playlists.forEach(pl => {
                const li = document.createElement('li');
                li.className = `playlist-item ${pl.id === currentPlaylistId ? 'active' : ''}`;
                li.onclick = () => selectPlaylist(pl.id);
                li.innerHTML = `
                    <div class="playlist-info">
                        <i class="fa-solid fa-music"></i>
                        <span>${pl.name}</span>
                    </div>
                `;
                container.appendChild(li);
            });
            document.getElementById('current-playlist-title').innerText = playlists.find(p => p.id === currentPlaylistId).name;
        }

        function renderSongs() {
            const currentPl = playlists.find(p => p.id === currentPlaylistId);
            const container = document.getElementById('song-list-body');
            const emptyMsg = document.getElementById('empty-msg');
            container.innerHTML = '';

            if (!currentPl || currentPl.songs.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            currentPl.songs.forEach((song, index) => {
                const row = document.createElement('div');
                row.className = `song-row ${index === currentSongIndex ? 'active-song' : ''}`;
                row.onclick = (e) => {
                    if (e.target.closest('.btn-delete')) return;
                    playSong(index);
                };
                row.innerHTML = `
                    <div class="song-index">${index + 1}</div>
                    <div class="song-info">
                        <div class="song-icon-box">
                            <i class="fa-solid fa-music"></i>
                        </div>
                        <div class="song-text">
                            <span class="song-title">${song.title}</span>
                            <span class="song-artist">Local Track</span>
                        </div>
                    </div>
                    <div class="song-actions">
                        <button class="btn-delete" title="Xóa" onclick="deleteSong(${index})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function setupMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: 'spotify by min'
                });
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        }

        renderPlaylists();
    </script>
</body>
</html>
