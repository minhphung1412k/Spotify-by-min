Dưới đây là toàn bộ mã nguồn (được gộp chung HTML, CSS, JavaScript vào một file để bạn dễ dàng chạy thử ngay lập tức). Giao diện sử dụng thiết kế tối màu (Dark Mode), gradient mượt mà, cùng các hiệu ứng hover chuyên nghiệp.

### Hướng dẫn chạy thử:
1. Tạo một file tên là `index.html` trên máy tính.
2. Copy toàn bộ đoạn code bên dưới dán vào file đó và lưu lại.
3. Click đúp vào file `index.html` để mở bằng trình duyệt (Chrome/Edge) và trải nghiệm.

```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Player | Trải nghiệm âm nhạc đỉnh cao</title>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <link href="[https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1DB954;
            --bg-dark: #121212;
            --bg-panel: #181818;
            --bg-hover: #282828;
            --text-main: #FFFFFF;
            --text-sub: #B3B3B3;
            --player-height: 90px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- MAIN CONTAINER --- */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--player-height));
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background-color: #000000;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            padding: 0 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i { color: var(--primary-color); }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-links li {
            padding: 10px 12px;
            color: var(--text-sub);
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links li:hover, .nav-links li.active {
            color: var(--text-main);
        }
        
        .nav-links li.active { background-color: var(--bg-hover); }

        /* --- MAIN VIEW --- */
        .main-view {
            flex: 1;
            background: linear-gradient(180deg, #2a2d36 0%, var(--bg-dark) 100%);
            padding: 24px;
            overflow-y: auto;
        }

        .main-header {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .song-item:hover { background-color: rgba(255, 255, 255, 0.1); }

        .song-item img {
            width: 45px;
            height: 45px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        .song-info-list { flex: 1; }
        .song-title-list { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .song-artist-list { font-size: 14px; color: var(--text-sub); }

        /* --- PLAYER BAR --- */
        .player-bar {
            height: var(--player-height);
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        /* 1. Track Info (Left) */
        .track-info {
            display: flex;
            align-items: center;
            width: 30%;
            min-width: 180px;
        }

        .track-info img {
            width: 56px;
            height: 56px;
            border-radius: 5px;
            margin-right: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            object-fit: cover;
        }

        .track-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .track-artist { font-size: 12px; color: var(--text-sub); }

        /* 2. Controls (Center) */
        .player-controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
            max-width: 600px;
        }

        .main-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-control:hover { color: var(--text-main); }

        .btn-play {
            width: 35px;
            height: 35px;
            background-color: var(--text-main);
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .btn-play:hover { transform: scale(1.1); }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-bar:hover .progress-fill { background-color: var(--primary-color); }

        /* 3. Extra Controls (Right) */
        .extra-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 30%;
            gap: 15px;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .sidebar { display: none; } /* Giấu sidebar trên điện thoại */
            .track-info { width: 40%; }
            .extra-controls { display: none; } /* Giấu chỉnh âm lượng trên điện thoại */
            .player-controls-container { width: 60%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-spotify"></i> G-Player
            </div>
            <ul class="nav-links">
                <li class="active"><i class="fa-solid fa-house"></i> Trang chủ</li>
                <li><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm</li>
                <li><i class="fa-solid fa-book"></i> Thư viện</li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-view">
            <h1 class="main-header">Dành cho bạn</h1>
            <div class="song-list" id="playlist">
                <!-- Nhạc sẽ được render từ JavaScript -->
            </div>
        </main>
    </div>

    <!-- Thanh Player dưới cùng -->
    <div class="player-bar">
        <div class="track-info">
            <img id="cover" src="[https://via.placeholder.com/150/181818/FFFFFF?text=Logo](https://via.placeholder.com/150/181818/FFFFFF?text=Logo)" alt="Album Cover">
            <div>
                <div class="track-title" id="title">Chưa có bài hát</div>
                <div class="track-artist" id="artist">Trống</div>
            </div>
        </div>

        <div class="player-controls-container">
            <div class="main-controls">
                <button class="btn-control"><i class="fa-solid fa-shuffle"></i></button>
                <button class="btn-control" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="btn-play" id="playBtn"><i class="fa-solid fa-play"></i></button>
                <button class="btn-control" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
                <button class="btn-control"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="progress-container">
                <span id="currTime">0:00</span>
                <div class="progress-bar" id="progressContainer">
                    <div class="progress-fill" id="progress"></div>
                </div>
                <span id="durTime">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <button class="btn-control"><i class="fa-solid fa-volume-high"></i></button>
            <div class="progress-bar" style="width: 100px;">
                <div class="progress-fill" style="width: 100%; background-color: var(--text-main);"></div>
            </div>
        </div>
    </div>

    <!-- Audio Element Ẩn -->
    <audio id="audio"></audio>

    <script>
        // MẢNG DỮ LIỆU BÀI HÁT (Thay đổi link mp3 và hình ảnh thật tại đây)
        const songs = [
            {
                title: "Lofi Study Focus",
                artist: "G-Chill",
                src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3)",
                cover: "[https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=500&q=80](https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=500&q=80)"
            },
            {
                title: "Night Drive Synthwave",
                artist: "Neon Rider",
                src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3)",
                cover: "[https://images.unsplash.com/photo-1614624532983-4ce03382d63d?w=500&q=80](https://images.unsplash.com/photo-1614624532983-4ce03382d63d?w=500&q=80)"
            },
            {
                title: "Acoustic Sunset",
                artist: "Indie Vibes",
                src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3)",
                cover: "[https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=500&q=80](https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=500&q=80)"
            }
        ];

        let songIndex = 0;
        let isPlaying = false;

        // Bắt các element DOM
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progressContainer');
        const currTime = document.getElementById('currTime');
        const durTime = document.getElementById('durTime');
        const playlistEl = document.getElementById('playlist');

        // Render danh sách phát
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, index) => {
                const songEl = document.createElement('div');
                songEl.classList.add('song-item');
                songEl.innerHTML = `
                    <img src="${song.cover}" alt="Cover">
                    <div class="song-info-list">
                        <div class="song-title-list">${song.title}</div>
                        <div class="song-artist-list">${song.artist}</div>
                    </div>
                `;
                songEl.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                playlistEl.appendChild(songEl);
            });
        }

        // Tải bài hát vào player
        function loadSong(song) {
            title.innerText = song.title;
            artist.innerText = song.artist;
            cover.src = song.cover;
            audio.src = song.src;
        }

        // Play / Pause
        function playSong() {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseSong();
            else playSong();
        });

        // Next / Prev
        function prevSong() {
            songIndex--;
            if (songIndex < 0) songIndex = songs.length - 1;
            loadSong(songs[songIndex]);
            playSong();
        }

        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) songIndex = 0;
            loadSong(songs[songIndex]);
            playSong();
        }

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        // Cập nhật thanh tiến trình
        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if(isNaN(duration)) return;
            
            // Cập nhật vạch chạy
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;

            // Cập nhật số thời gian
            let min_curr = Math.floor(currentTime / 60);
            let sec_curr = Math.floor(currentTime % 60);
            if(sec_curr < 10) sec_curr = `0${sec_curr}`;
            currTime.innerText = `${min_curr}:${sec_curr}`;

            let min_dur = Math.floor(duration / 60);
            let sec_dur = Math.floor(duration % 60);
            if(sec_dur < 10) sec_dur = `0${sec_dur}`;
            durTime.innerText = `${min_dur}:${sec_dur}`;
        }
        audio.addEventListener('timeupdate', updateProgress);

        // Tua nhạc khi click vào thanh tiến trình
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }
        progressContainer.addEventListener('click', setProgress);

        // Tự chuyển bài khi hết nhạc
        audio.addEventListener('ended', nextSong);

        // Khởi tạo ban đầu
        renderPlaylist();
        loadSong(songs[songIndex]);
    </script>
</body>
</html>
