<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Máy Phát Nhạc Đỉnh Cao</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1db954;
            --bg-main: #0a0a0c;
            --card-bg: rgba(22, 22, 28, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; overflow-x: hidden; position: relative;
        }

        /* Nền mờ ảo diệu đổi theo bài hát */
        .ambient-bg {
            position: fixed; top: -20%; left: -20%;
            width: 140%; height: 140%;
            background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.25);
            z-index: -1; transition: background-image 0.8s ease-in-out;
        }

        /* Khung chính của App */
        .app-container {
            width: 100%; max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 28px; padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex; flex-direction: column; gap: 18px;
        }

        .app-header { display: flex; align-items: center; justify-content: space-between; }
        .app-logo { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        /* Khung nhập link */
        .search-box {
            display: flex; gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 6px 6px 14px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .search-box input { flex: 1; background: none; border: none; color: #fff; font-size: 13px; outline: none; }
        .search-box button {
            background: var(--primary); color: #000; border: none;
            padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .search-box button:active { transform: scale(0.95); }

        /* Ảnh bìa */
        .artwork-wrapper {
            width: 100%; aspect-ratio: 1; border-radius: 20px;
            overflow: hidden; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            background-color: #18181c; display: flex; align-items: center; justify-content: center;
        }
        .artwork-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .artwork-placeholder { font-size: 50px; color: var(--text-sub); }

        /* Thông tin bài đang phát */
        .track-details { text-align: center; }
        .track-title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .track-artist { font-size: 13px; color: var(--text-sub); }

        /* Thanh thời gian */
        .progress-box { display: flex; flex-direction: column; gap: 6px; }
        .seekbar {
            width: 100%; height: 5px; -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.15); border-radius: 10px; outline: none; cursor: pointer;
        }
        .seekbar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
        .time-stamps { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); }

        /* Nút bấm điều khiển */
        .controls { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
        .btn-icon { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; transition: 0.2s; }
        .btn-icon.active, .btn-icon:hover { color: var(--primary); }
        .btn-play {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--primary); color: #000; border: none; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4); transition: transform 0.2s;
        }
        .btn-play:active { transform: scale(0.92); }

        /* Cấu trúc Danh sách phát */
        .playlist-header { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-top: 5px; display: flex; justify-content: space-between; }
        .playlist-box { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        
        /* Tùy chỉnh thanh cuộn đẹp mắt */
        .playlist-box::-webkit-scrollbar { width: 4px; }
        .playlist-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .playlist-item {
            display: flex; align-items: center; gap: 12px; padding: 8px 10px;
            background: rgba(255, 255, 255, 0.04); border-radius: 12px; cursor: pointer; transition: 0.2s;
            position: relative;
        }
        .playlist-item:hover, .playlist-item.active { background: rgba(29, 185, 84, 0.15); }
        .playlist-thumb { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
        .playlist-info { flex: 1; overflow: hidden; padding-right: 60px; /* Chừa chỗ cho nút sửa/xóa */ }
        .playlist-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .playlist-artist { font-size: 11px; color: var(--text-sub); }

        /* Nút Sửa / Xóa trong danh sách */
        .playlist-actions {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            display: flex; gap: 12px; opacity: 0.7;
        }
        .playlist-actions button {
            background: none; border: none; font-size: 14px; cursor: pointer; padding: 5px;
            color: var(--text-sub); transition: 0.2s;
        }
        .playlist-actions button.btn-edit:hover { color: #3b82f6; opacity: 1; } /* Màu xanh dương khi bấm sửa */
        .playlist-actions button.btn-delete:hover { color: #ef4444; opacity: 1; } /* Màu đỏ khi bấm xóa */

        /* Thông báo (Toast) */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px 24px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            border: 1px solid var(--border-color); opacity: 0; pointer-events: none;
            transition: opacity 0.3s; white-space: nowrap; z-index: 100;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- Hình nền mờ tự động -->
    <div class="ambient-bg" id="ambient-bg"></div>

    <div class="app-container">
        <div class="app-header">
            <div class="app-logo"><i class="fa-brands fa-spotify"></i><span>G-Music Tối Thượng</span></div>
        </div>

        <!-- Khung thêm nhạc -->
        <div class="search-box">
            <input type="text" id="yt-url" placeholder="Dán liên kết YouTube vào đây...">
            <button onclick="addSongFromURL()">Thêm bài</button>
        </div>

        <!-- Ảnh đĩa nhạc -->
        <div class="artwork-wrapper">
            <i class="fa-brands fa-youtube artwork-placeholder" id="placeholder-icon"></i>
            <img src="" id="artwork" class="artwork-img" alt="Ảnh bìa">
        </div>

        <!-- Tiêu đề bài hát -->
        <div class="track-details">
            <div class="track-title" id="track-title">Chưa chọn bài hát nào</div>
            <div class="track-artist" id="track-artist">Sẵn sàng bùng nổ âm nhạc</div>
        </div>

        <!-- Thanh tua nhạc -->
        <div class="progress-box">
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekTo(this.value)">
            <div class="time-stamps">
                <span id="curr-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <!-- Cụm nút điều khiển -->
        <div class="controls">
            <button class="btn-icon" id="btn-shuffle" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
            <button class="btn-icon" onclick="playPrev()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" id="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
            <button class="btn-icon" onclick="playNext()"><i class="fa-solid fa-forward-step"></i></button>
            <button class="btn-icon" id="btn-repeat" onclick="toggleRepeat()"><i class="fa-solid fa-repeat"></i></button>
        </div>

        <!-- Danh sách bài hát -->
        <div class="playlist-header">
            <span>Danh sách phát của bạn</span>
            <span id="song-count">0 bài</span>
        </div>
        <div class="playlist-box" id="playlist"></div>
    </div>

    <!-- Hộp thoại thông báo -->
    <div class="toast" id="toast"></div>
    <audio id="audio-element"></audio>

    <script>
        const audio = document.getElementById('audio-element');
        let playlist = JSON.parse(localStorage.getItem('gmusic_playlist_vip')) || [];
        let currentIndex = -1;
        let isShuffle = false, isRepeat = false;

        // DANH SÁCH 5 MÁY CHỦ BẢO VỆ CHỐNG LỖI 100%
        const SERVERS = [
            'https://pipedapi.kavin.rocks',
            'https://api.piped.privacydev.net',
            'https://pipedapi.tokhmi.xyz',
            'https://piped-api.garudalinux.org',
            'https://api.piped.mha.fi'
        ];

        window.onload = () => renderPlaylist();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        // Kỹ thuật tự động đổi Server không lo bị ngỏm
        async function fetchAudioWithFallback(videoId) {
            for (let i = 0; i < SERVERS.length; i++) {
                try {
                    const res = await fetch(`${SERVERS[i]}/streams/${videoId}`);
                    if (!res.ok) continue;
                    
                    const data = await res.json();
                    if (data && data.audioStreams && data.audioStreams.length > 0) {
                        return data;
                    }
                } catch (err) {
                    console.warn(`Máy chủ ${i + 1} bận, tự động chuyển...`);
                }
            }
            throw new Error("Mạng đang nghẽn!");
        }

        async function addSongFromURL() {
            const input = document.getElementById('yt-url');
            const videoId = extractVideoId(input.value.trim());

            if (!videoId) {
                showToast("Liên kết không đúng định dạng!");
                return;
            }

            showToast("Đang tải dữ liệu chuẩn chất lượng cao...");

            try {
                const data = await fetchAudioWithFallback(videoId);
                const audioStream = data.audioStreams.find(s => s.mimeType.includes('mp4') || s.mimeType.includes('m4a')) || data.audioStreams[0];

                const song = {
                    id: videoId,
                    title: data.title,
                    artist: data.uploader,
                    thumbnail: data.thumbnailUrl,
                    audioUrl: audioStream.url
                };

                const existIdx = playlist.findIndex(s => s.id === videoId);
                if (existIdx === -1) {
                    playlist.push(song);
                    saveData();
                    renderPlaylist();
                    playSong(playlist.length - 1);
                    showToast("Đã thêm bài hát tuyệt vời này!");
                } else {
                    playSong(existIdx);
                    showToast("Bài này đã có trong danh sách rồi!");
                }
                input.value = '';

            } catch (err) {
                showToast("Không thể tải bài này, hãy thử bài khác nhé!");
            }
        }

        // HÀM CHỈNH SỬA TÊN BÀI HÁT
        function editSong(index, event) {
            event.stopPropagation(); // Ngăn việc nhấn vào nút sửa lại thành phát nhạc
            const currentName = playlist[index].title;
            const newName = prompt("Nhập tên mới cho bài hát này:", currentName);
            
            if (newName !== null && newName.trim() !== "") {
                playlist[index].title = newName.trim();
                saveData();
                renderPlaylist();
                
                // Nếu đang phát bài này thì đổi tên trên màn hình luôn
                if (index === currentIndex) {
                    document.getElementById('track-title').innerText = playlist[index].title;
                }
                showToast("Đã đổi tên bài hát thành công!");
            }
        }

        // HÀM XOÁ BÀI HÁT
        function deleteSong(index, event) {
            event.stopPropagation(); // Ngăn việc nhấn vào nút xóa lại thành phát nhạc
            const confirmDelete = confirm("Bạn có chắc chắn muốn xoá bài '" + playlist[index].title + "' khỏi danh sách không?");
            
            if (confirmDelete) {
                playlist.splice(index, 1);
                saveData();
                
                // Xử lý logic nếu xoá trúng bài đang hát
                if (index === currentIndex) {
                    audio.pause();
                    currentIndex = -1;
                    document.getElementById('track-title').innerText = "Vui lòng chọn bài khác";
                    document.getElementById('track-artist').innerText = "";
                    document.getElementById('artwork').style.display = 'none';
                    document.getElementById('placeholder-icon').style.display = 'block';
                    document.getElementById('ambient-bg').style.backgroundImage = 'none';
                    updatePlayBtn(false);
                } else if (index < currentIndex) {
                    currentIndex--; // Lùi index lại để không bị lệch bài đang phát
                }
                
                renderPlaylist();
                showToast("Đã xoá bài hát!");
            }
        }

        function saveData() {
            localStorage.setItem('gmusic_playlist_vip', JSON.stringify(playlist));
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist');
            document.getElementById('song-count').innerText = `${playlist.length} bài`;
            container.innerHTML = '';
            
            playlist.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                item.onclick = () => playSong(idx);
                
                item.innerHTML = `
                    <img class="playlist-thumb" src="${song.thumbnail}" alt="ảnh thu nhỏ">
                    <div class="playlist-info">
                        <div class="playlist-title">${song.title}</div>
                        <div class="playlist-artist">${song.artist}</div>
                    </div>
                    <div class="playlist-actions">
                        <button class="btn-edit" onclick="editSong(${idx}, event)" title="Sửa tên bài"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-delete" onclick="deleteSong(${idx}, event)" title="Xoá bài"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const song = playlist[currentIndex];

            document.getElementById('track-title').innerText = song.title;
            document.getElementById('track-artist').innerText = song.artist;
            
            const artwork = document.getElementById('artwork');
            artwork.src = song.thumbnail;
            artwork.style.display = 'block';
            document.getElementById('placeholder-icon').style.display = 'none';
            document.getElementById('ambient-bg').style.backgroundImage = `url('${song.thumbnail}')`;

            audio.src = song.audioUrl;
            audio.play().then(() => updatePlayBtn(true)).catch(() => showToast("Vui lòng chạm vào nút Phát"));

            // Cập nhật màn hình khóa
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: [{ src: song.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
                });
            }
            renderPlaylist();
        }

        function togglePlay() {
            if (currentIndex === -1 && playlist.length > 0) { playSong(0); return; }
            if (!audio.src) return;
            if (audio.paused) { audio.play(); updatePlayBtn(true); } 
            else { audio.pause(); updatePlayBtn(false); }
        }

        function updatePlayBtn(isPlaying) {
            document.getElementById('btn-play').innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        }

        function playNext() {
            if (playlist.length === 0) return;
            let nextIdx = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
            playSong(nextIdx);
        }

        function playPrev() {
            if (playlist.length === 0) return;
            let prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
            playSong(prevIdx);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('btn-shuffle').classList.toggle('active', isShuffle);
            showToast(isShuffle ? "Đã bật chế độ phát ngẫu nhiên" : "Đã tắt chế độ phát ngẫu nhiên");
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('btn-repeat').classList.toggle('active', isRepeat);
            showToast(isRepeat ? "Sẽ lặp lại bài hát này" : "Đã tắt chế độ lặp lại");
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                document.getElementById('seekbar').value = (audio.currentTime / audio.duration) * 100;
                document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
                document.getElementById('total-time').innerText = formatTime(audio.duration);
            }
        };

        audio.onended = () => { if (isRepeat) audio.play(); else playNext(); };

        function seekTo(val) { if (audio.duration) audio.currentTime = (val / 100) * audio.duration; }

        function formatTime(sec) {
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
